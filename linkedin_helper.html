<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Helper — Wilfredo Caro</title>
    <style>
        :root {
            --bg: #0b0c10;
            --surface: #1f2833;
            --primary: #2563eb;
            --secondary: #00f5ff;
            --accent: #2563eb;
            --text: #e4e4e7;
            --text-muted: #9a9a9e;
            --border: #27272a;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            background: linear-gradient(135deg, var(--accent) 0%, #115e33 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tabs {
            display: flex;
            background: #18181b;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--surface);
            color: white;
            border-bottom: 2px solid var(--accent);
        }

        .card {
            background: #18181b;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title {
            font-weight: bold;
            color: var(--accent);
            font-size: 16px;
        }

        .copy-btn {
            background: var(--surface);
            color: white;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .text-box {
            background: #09090b;
            border: 1px solid #1c1c1f;
            border-radius: 6px;
            padding: 12px;
            color: #d4d4d8;
            font-size: 14px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🤖 LinkedIn Profile Helper</h1>
                <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Wilfredo Caro — Actualización de Perfil</div>
            </div>
            <button class="copy-btn" onclick="window.close()" style="background: #ef4444; border: none;">Cerrar</button>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchLang('es')" id="btn-es">Español (ES)</button>
            <button class="tab-btn" onclick="switchLang('en')" id="btn-en">English (EN)</button>
        </div>

        <div id="content">
            <!-- Dinámico -->
        </div>
    </div>

    <script type="module" src="/src/linkedin-helper-main.js"></script>
</body>
</html>
