<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="facet2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="facet3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="facet4" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9b8fff" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="neonSeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#cfff04" />
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Outer Tech Guide Frame -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" 
           stroke="rgba(255, 255, 255, 0.09)" 
           stroke-width="1.2" 
           fill="rgba(10, 14, 24, 0.4)" />

  <!-- Monolithic Facet 1 (Outer Left Pillar) -->
  <polygon points="14,24 28,24 40,78 26,78" fill="url(#facet1)" opacity="0.95" />
  
  <!-- Monolithic Facet 2 (Inner Left Rise) -->
  <polygon points="26,78 40,78 50,42 42,38" fill="url(#facet2)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.8" />
  
  <!-- Monolithic Facet 3 (Inner Right Drop) -->
  <polygon points="50,42 58,38 74,78 60,78" fill="url(#facet3)" opacity="0.95" />

  <!-- Monolithic Facet 4 (Outer Right Pillar) -->
  <polygon points="74,78 60,78 72,24 86,24" fill="url(#facet4)" opacity="0.9" />

  <!-- Glowing Neon Core Seam (Quantum Bridge) -->
  <polyline points="28,24 40,78 50,42 60,78 72,24" 
            stroke="url(#neonSeam)" 
            stroke-width="2.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            filter="url(#laserGlow)" />

  <!-- Center Quantum Core Spark -->
  <circle cx="50" cy="42" r="3.5" fill="#ffffff" />
  <circle cx="50" cy="42" r="6" stroke="#00f5ff" stroke-width="1.5" opacity="0.8" />
</svg>
