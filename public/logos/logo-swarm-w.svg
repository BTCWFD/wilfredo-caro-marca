<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="swarmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="55%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#9b8fff" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cfff04" />
      <stop offset="100%" stop-color="#00f5ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Subtle Geometric Halo -->
  <circle cx="50" cy="50" r="44" stroke="rgba(0, 245, 255, 0.12)" stroke-width="1" stroke-dasharray="3 4" />
  
  <!-- Swarm Connection Web (Background Paths) -->
  <path d="M18 26 L50 48 L82 26" stroke="rgba(37, 99, 235, 0.3)" stroke-width="1.5" stroke-dasharray="2 3" />
  <path d="M34 74 L50 48 L66 74" stroke="rgba(0, 245, 255, 0.35)" stroke-width="1.5" stroke-dasharray="2 3" />

  <!-- Main "W" Trajectory Vectors -->
  <path d="M18 26 L34 74 L50 48 L66 74 L82 26" 
        stroke="url(#swarmGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner High-Intensity Beam -->
  <path d="M18 26 L34 74 L50 48 L66 74 L82 26" 
        stroke="#ffffff" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        stroke-opacity="0.85" />

  <!-- Nodes (Agent Units) -->
  <!-- Top Left Node -->
  <circle cx="18" cy="26" r="4.5" fill="#080a12" stroke="#00f5ff" stroke-width="2.5" />
  <circle cx="18" cy="26" r="1.8" fill="#ffffff" />

  <!-- Bottom Left Node -->
  <circle cx="34" cy="74" r="4.5" fill="#080a12" stroke="#2563eb" stroke-width="2.5" />
  <circle cx="34" cy="74" r="1.8" fill="#00f5ff" />

  <!-- Central Orchestrator Apex (Flagship Node) -->
  <circle cx="50" cy="48" r="6" fill="#080a12" stroke="url(#coreGlow)" stroke-width="2.5" />
  <circle cx="50" cy="48" r="2.5" fill="#cfff04" />
  <!-- Pulse Ring -->
  <circle cx="50" cy="48" r="10" stroke="rgba(207, 255, 4, 0.4)" stroke-width="1" />

  <!-- Bottom Right Node -->
  <circle cx="66" cy="74" r="4.5" fill="#080a12" stroke="#2563eb" stroke-width="2.5" />
  <circle cx="66" cy="74" r="1.8" fill="#00f5ff" />

  <!-- Top Right Node -->
  <circle cx="82" cy="26" r="4.5" fill="#080a12" stroke="#9b8fff" stroke-width="2.5" />
  <circle cx="82" cy="26" r="1.8" fill="#ffffff" />
</svg>
