# Configuration for Netlify Production Deployments
[build]
  publish = "dist"
  command = "npm run build"

# Bundle the gated PDF (lives outside the published site) into the functions
# so cv.js can stream it after validating the token.
[functions]
  included_files = ["private/**"]

# NOTE: the canonical 301 (netlify.app -> wilfredocaro.com) is intentionally
# removed until the custom domain is configured in Netlify. Once you add
# wilfredocaro.com as the primary domain, Netlify performs that redirect
# automatically — no manual rule needed here.

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://wilfredocaro.com https://www.google-analytics.com https://www.googletagmanager.com; frame-src 'self' https://www.youtube.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; media-src 'self' https://www.soundhelix.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
